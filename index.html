<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Voom - App Oficial</title>
  
  <!-- Metadatos PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Voom">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- OneSignal Web Push SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "98bfb199-5190-4c51-93b0-2cffb11c79e7",
        notifyButton: { enable: true },
      });
    });
  </script>

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden pb-24 sm:pb-6">

  <!-- Adornos gráficos -->
  <div class="absolute -top-24 -left-24 w-80 h-80 bg-orange-400/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-24 -right-24 w-80 h-80 bg-amber-400/15 rounded-full blur-3xl pointer-events-none"></div>

  <!-- OVERLAY DE INSTALACIÓN PWA (Android / Desktop) -->
  <div id="pwa-install-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-[9999] flex items-center justify-center p-6 text-center hidden">
    <div class="max-w-sm w-full bg-white border border-slate-200/80 p-8 rounded-3xl shadow-2xl relative overflow-hidden space-y-6">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-orange-500 to-amber-500 rounded-3xl text-white shadow-xl shadow-orange-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
      </div>
      <div>
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Instala Voom</h2>
        <p class="text-xs font-medium text-slate-500 mt-2 leading-relaxed">
          Para garantizar la máxima seguridad y mejor rendimiento, instala la aplicación en tu pantalla de inicio.
        </p>
      </div>
      <button id="btn-pwa-install" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-black py-4 rounded-2xl transition-all shadow-xl shadow-orange-500/30 text-sm tracking-wide active:scale-[0.98]">
        Instalar Aplicación Oficial 🚀
      </button>
    </div>
  </div>

  <!-- BANNER FLOTANTE EXCLUSIVO PARA iPHONE -->
  <div id="ios-installer-banner" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-slate-900/95 text-white p-4 rounded-3xl shadow-2xl z-[9999] hidden border border-slate-700/50 backdrop-blur-md animate-bounce">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-tr from-orange-500 to-amber-500 rounded-2xl flex items-center justify-center text-xl shrink-0">
          📲
        </div>
        <div>
          <p class="text-xs font-black tracking-wide text-white">Instalar Voom en tu iPhone</p>
          <p class="text-[10px] text-slate-300 mt-0.5">Toca <span class="text-orange-400 font-extrabold">Compartir ⎘</span> y luego <span class="text-orange-400 font-extrabold">"Agregar al inicio" ➕</span></p>
        </div>
      </div>
      <div class="text-2xl animate-pulse text-orange-400 shrink-0">
        👇
      </div>
    </div>
  </div>

  <!-- TARJETA PRINCIPAL -->
  <div id="app-content" class="w-full max-w-md bg-white rounded-3xl shadow-[0_15px_40px_-15px_rgba(0,0,0,0.08)] border border-slate-200/80 p-8 relative z-10">
    
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-orange-500 via-orange-600 to-amber-500 text-white rounded-2xl shadow-lg shadow-orange-500/25 mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
          <circle cx="7" cy="17" r="2"/>
          <path d="M9 17h6"/>
          <circle cx="17" cy="17" r="2"/>
        </svg>
      </div>
      <h1 class="text-3xl font-black text-slate-900 tracking-tight">Voom</h1>
      <p class="text-[11px] font-bold text-orange-600 uppercase tracking-widest mt-1">Rápido, Confiable y Seguro</p>
    </div>

    <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-6 border border-slate-200/80">
      <button id="btn-tab-login" type="button" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-white text-orange-600 shadow-sm transition-all duration-200">
        Iniciar Sesión
      </button>
      <button id="btn-tab-register" type="button" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200">
        Crear Cuenta
      </button>
    </div>

    <!-- Formulario Login -->
    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Correo Electrónico</label>
        <input type="email" id="login-email" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white focus:ring-4 focus:ring-orange-500/10 transition-all" placeholder="nombre@correo.com" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Contraseña</label>
        <div class="relative flex items-center">
          <input type="password" id="login-password" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 pr-12 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white focus:ring-4 focus:ring-orange-500/10 transition-all" placeholder="••••••••" />
          <button type="button" onclick="togglePassword('login-password', 'eye-login')" class="absolute right-4 text-slate-400 hover:text-slate-600 focus:outline-none">
            <svg id="eye-login" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-black py-4 rounded-2xl transition-all shadow-xl shadow-orange-500/25 text-sm tracking-wide active:scale-[0.98]">
        Entrar a la Plataforma
      </button>
    </form>

    <!-- Formulario Registro -->
    <form id="form-register" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Nombre Completo</label>
        <input type="text" id="reg-name" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white focus:ring-4 focus:ring-orange-500/10 transition-all" placeholder="Ej. Carlos Mendoza" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">DNI</label>
          <input type="text" id="reg-dni" required maxlength="8" pattern="[0-9]{8}" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white focus:ring-4 focus:ring-orange-500/10 transition-all" placeholder="8 dígitos" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Celular</label>
          <input type="tel" id="reg-telefono" required maxlength="9" pattern="9[0-9]{8}" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white focus:ring-4 focus:ring-orange-500/10 transition-all" placeholder="9XXXXXXXX" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Correo Electrónico</label>
        <input type="email" id="reg-email" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white focus:ring-4 focus:ring-orange-500/10 transition-all" placeholder="tu@email.com" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Contraseña</label>
        <div class="relative flex items-center">
          <input type="password" id="reg-password" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 pr-12 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white focus:ring-4 focus:ring-orange-500/10 transition-all" placeholder="••••••••" />
          <button type="button" onclick="togglePassword('reg-password', 'eye-reg')" class="absolute right-4 text-slate-400 hover:text-slate-600 focus:outline-none">
            <svg id="eye-reg" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-black py-4 rounded-2xl transition-all shadow-xl shadow-orange-500/25 text-sm tracking-wide active:scale-[0.98]">
        Crear Cuenta y Registrar
      </button>
    </form>

    <div id="status-message" class="mt-4 p-3.5 rounded-2xl text-xs text-center hidden font-bold border"></div>

  </div>

  <!-- Enlace al archivo JS externo listo para ofuscar -->
  <script src="./js/index.js"></script>
</body>
</html>
