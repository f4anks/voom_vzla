<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Voom - Panel de Control Admin</title>

  <!-- Metadatos PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Voom Admin">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- Header Admin -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-6 py-4 flex items-center justify-between z-10 shadow-xs">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-gradient-to-tr from-slate-900 to-slate-800 rounded-2xl flex items-center justify-center text-orange-500 font-black text-base shadow-md">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <div>
        <h1 class="text-base font-black text-slate-900 tracking-tight leading-tight">Voom Admin</h1>
        <span class="text-[10px] text-orange-600 font-extrabold uppercase tracking-wider">Gestión de Flota</span>
      </div>
    </div>

    <div class="flex items-center space-x-3">
      <span id="admin-email" class="hidden sm:inline text-xs font-bold text-slate-600">Cargando...</span>
      <button onclick="logoutAdmin()" class="text-xs bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 font-bold px-4 py-2.5 rounded-xl transition-all border border-slate-200">
        Salir
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- Tarjeta de Envío de Anuncios Globales por Destinatario -->
    <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-[0_10px_30px_-10px_rgba(0,0,0,0.05)] space-y-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center font-bold text-lg">
          📢
        </div>
        <div>
          <h2 class="text-sm font-black text-slate-900 tracking-tight uppercase">Enviar Anuncio a la Red Voom</h2>
          <p class="text-xs font-semibold text-slate-500">Transmite un comunicado dirigido a pasajeros, conductores o ambos</p>
        </div>
      </div>

      <div class="space-y-3">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Título del Anuncio</label>
            <input type="text" id="anuncio-titulo" placeholder="Ej. ¡Tarifa especial este fin de semana!" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white transition-all" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Dirigido a</label>
            <select id="anuncio-destinatario" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs font-bold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white transition-all">
              <option value="todos">🌐 Toda la Red (Todos)</option>
              <option value="pasajeros">👤 Solo Pasajeros</option>
              <option value="conductores">🚘 Solo Conductores</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Mensaje</label>
          <textarea id="anuncio-mensaje" rows="3" placeholder="Escribe los detalles del comunicado..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white transition-all resize-none"></textarea>
        </div>

        <div class="flex items-center justify-between pt-2">
          <span id="anuncio-status" class="text-xs font-bold text-slate-400"></span>
          <button onclick="enviarAnuncioGlobal()" class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-black px-6 py-3 rounded-2xl transition-all shadow-lg shadow-orange-500/20 text-xs tracking-wide active:scale-95">
            Transmitir Anuncio 🚀
          </button>
        </div>
      </div>
    </div>

    <!-- Filtros y Métricas -->
    <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-[0_10px_30px_-10px_rgba(0,0,0,0.05)] flex flex-col md:flex-row items-center justify-between gap-4">
      <div>
        <h2 class="text-lg font-black text-slate-900 tracking-tight">Conductores Registrados</h2>
        <p class="text-xs font-semibold text-slate-500 mt-0.5">Aprueba solicitudes pendientes o gestiona accesos activos</p>
      </div>

      <!-- Pestañas de Filtro -->
      <div class="flex bg-slate-100 p-1 rounded-2xl border border-slate-200/80 w-full md:w-auto">
        <button onclick="filtrarConductores('todos')" id="tab-todos" class="px-4 py-2 text-xs font-bold rounded-xl bg-white text-orange-600 shadow-xs transition-all">
          Todos (<span id="count-todos">0</span>)
        </button>
        <button onclick="filtrarConductores('pendiente')" id="tab-pendiente" class="px-4 py-2 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 transition-all">
          Pendientes (<span id="count-pendiente">0</span>)
        </button>
        <button onclick="filtrarConductores('aprobado')" id="tab-aprobado" class="px-4 py-2 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 transition-all">
          Aprobados (<span id="count-aprobado">0</span>)
        </button>
        <button onclick="filtrarConductores('suspendido')" id="tab-suspendido" class="px-4 py-2 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-800 transition-all">
          Suspendidos (<span id="count-suspendido">0</span>)
        </button>
      </div>
    </div>

    <!-- Lista de Tarjetas de Conductores -->
    <div id="contenedor-conductores" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <p class="col-span-full text-center py-12 text-xs font-semibold text-slate-400">Cargando lista de conductores...</p>
    </div>
  </main>

  <!-- Modal para Inspeccionar Documentos -->
  <div id="modal-docs" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-[2000] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 border border-slate-200 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 id="modal-titulo-conductor" class="text-sm font-black text-slate-900 uppercase tracking-wider">Documentos del Conductor</h3>
        <button onclick="cerrarModalDocs()" class="text-slate-400 hover:text-slate-700 font-bold text-lg px-2">✕</button>
      </div>

      <div id="modal-cuerpo-docs" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <!-- Contenido dinámico -->
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
  <script src="js/anuncios.js"></script>
</body>
</html>
